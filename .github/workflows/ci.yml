name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Check tooling formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}

      - name: Build relay
        run: npm run build:server

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install smoke test dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Validate Compose
        run: docker compose -f compose.yaml -f deploy/compose.smoke.yaml config --quiet

      - name: Build and start deployment
        run: docker compose -f compose.yaml -f deploy/compose.smoke.yaml up --build --detach --wait --wait-timeout 120

      - name: Check static client and proxied relay
        run: node scripts/smoke-deployment.mjs

      - name: Deployment diagnostics
        if: failure()
        run: docker compose -f compose.yaml -f deploy/compose.smoke.yaml logs --no-color --tail 100

      - name: Stop deployment
        if: always()
        run: docker compose -f compose.yaml -f deploy/compose.smoke.yaml down --volumes
